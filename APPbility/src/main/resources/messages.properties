# CONTINENTE ---------------------------------------------------------------------------------------------

continente.nombre.notBlank=El nombre de un continente no puede estar vacío, debe contener al menos un carácter.

# PAIS ---------------------------------------------------------------------------------------------------

pais.nombre.notBlank=El nombre de un país no puede estar vacío, debe contener al menos un carácter.
pais.codigoISO.size=El código ISO de un país debe contener exactamente 2 caracteres.
pais.codigoISO.notBlank=El código ISO de un país no puede estar vacío, debe contener exactamente 2 caracteres.
pais.continenteID.notNull=Se debe especificar un continente para el país.

# NIVEL --------------------------------------------------------------------------------------------------

nivel.nombre.notBlank=El nombre de un nivel no puede estar vacío, debe contener al menos un carácter.
nivel.color.pattern=El color de un nivel debe seguir la estructura de un código hexadecimal.
nivel.color.notBlank=Un nivel debe tener asociado un color, es vital para distinguirlo.
nivel.orden.min=El dígito de orden de un nivel no puede ser un número menor a 1.
nivel.orden.notNull=Un número de orden debe ser especificado para el nivel.

# TALENTO ------------------------------------------------------------------------------------------------

talento.titulo.notBlank=El título de un talento no puede estar vacío, debe contener al menos un carácter.
talento.descripcion.notBlank=La descripción de un talento no puede estar vacía, debe contener al menos un carácter.
talento.nivelID.notNull=Se debe ser especificar un nivel para el talento.

# INTERCAMBIO --------------------------------------------------------------------------------------------

intercambio.usuarioSolicitadoID.notNull=Se debe especificar el usuario al que se le va a solicitar el intercambio.
intercambio.talentoSolicitadoID.notNull=Se debe especificar el talento que va a ser solicitado para el intercambio.
intercambio.talentoSugeridoID.notNull=Se debe especificar un talento como sugerencia para el usuario solicitado.

intercambio.talentoAceptadoID.notNull=Se debe seleccionar un talento del otro usuario para poder aceptar el intercambio solicitado.

# BLOQUE -------------------------------------------------------------------------------------------------

bloque.titulo.notBlank=El título de un bloque no puede estar vacío, debe contener al menos un carácter.
bloque.descripcion.notBlank=La descripción de un bloque no puede estar vacío, debe contener al menos un carácter.
bloque.hora.notNull=Se debe especificar una hora a la que llevar a cabo el bloque.

# SESION (Las validaciones para la sesión se encuentran en "CreateBloqueCMD"). ------

sesion.fecha.notNull=Se debe especificar una fecha para establecer la sesión.
sesion.fecha.FutureOrPresent=La fecha de la sesión debe ser igual o posterior a la fecha actual.
sesion.intercambioID.notNull=Se debe especificar el intercambio al que se le va a asociar esta sesión.

# VALORACION ---------------------------------------------------------------------------------------------

validacion.puntuacion.min=La puntuación de una valoración debe ser un número mayor que 1.
validacion.puntuacion.max=La puntuación de una valoración debe ser un número menor que 10.
validacion.puntuacion.notNull=Se debe especificar una puntuación en la valoración.
validacion.resenha.notBlank=La reseña de un bloque no puede estar vacía, debe contener al menos un carácter.

# USER ---------------------------------------------------------------------------------------------------

user.username.notBlank=El nombre de usuario de un usuario no puede estar vacío, debe contener al menos un carácter.
user.password.notBlank=La contraseña de un usuario no puede estar vacía, debe rellenarse obligatoriamente.
user.password.min=La contraseña de un usuario debe contener al menos 5 caracteres.
user.nombre.notBlank=El nombre de un usuario no puede estar vacío, debe contener al menos un carácter.
user.apellidos.notBlank=El campo de los apellidos de un usuario no puede estar vacío, debe contener al menos un carácter.
user.email.email=El email de un usuario carece del formato correcto.
user.email.notBlank=El email de un usuario no puede estar vacío, debe contener al menos un carácter.
user.fechaNacimiento.past=La fecha de la nacimiento debe ser anterior a la fecha actual.
user.fechaNacimiento.notNull=La fecha de nacimiento de un usuario no puede estar vacía, debe contener al menos un carácter.
user.sexo.notNull=Se debe especificar un sexo para el usuario.
user.modalidadPreferida.notNull=Se debe especificar una modalidad preferida con la que llevar a cabo los intercambios.
user.numTelefono.pattern=El número de teléfono debe seguir el formato internacional.
user.numTelefono.notBlank=El número de teléfono del usuario no puede estar vacío.
user.mostrarNumTelefono.notNull=Se debe especificar si se desea mostrar el número de teléfono durante los intercambios.
user.idiomaNativo.notNull=Se debe especificar el idioma nativo.
user.descripcionProfesional.notBlank=La descripción profesional de un usuario no puede estar vacía, debe contener al menos un carácter.
user.presentacionPersonal.notBlank=La presentación personal de un usuario no puede estar vacía, debe contener al menos un carácter.
user.paisNativo.notNull=Se debe especificar el país de nacimiento.
user.paisResidencia.notNull=Se debe especificar el país de residencia.

# TAG ----------------------------------------------------------------------------------------------------

editTagCmd.nombre.notblank=El nombre del tag no puede estar vacío.
editTagCmd.nombre.notnull=El nombre del tag no puede ser nulo.

